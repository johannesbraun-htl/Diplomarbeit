<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PresentAI – Analyse Dashboard</title>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Chart.js & Lucide Icons -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  --bg:#f6f7fb; --panel:#fff; --border:#e6e8ef; --text:#0f172a;
  --muted:#667085; --brand:#6d28d9; --good:#22c55e;
}
*{box-sizing:border-box}
body{
  font-family: ui-sans-serif,system-ui,Inter,Roboto,Arial;
  color:var(--text);
  background:
    radial-gradient(1100px 600px at 8% -20%, #ede9fe55 0%, transparent 60%),
    radial-gradient(900px 500px at 110% -10%, #dbeafe55 0%, transparent 55%),
    var(--bg);
  margin:0;
}
.app-header{
  height:64px; background:#fff8; backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; position:sticky; top:0; z-index:10;
}
.app-title{font-weight:800; letter-spacing:.2px;}
.chip{font-size:12px;padding:.15rem .55rem;border-radius:999px;background:#f3f4f6;border:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:.45rem;border-radius:12px;font-weight:700}
.btn-primary{padding:.55rem .9rem;background:var(--brand);color:#fff} .btn-primary:hover{filter:brightness(.95)}

main{max-width:1200px;margin:18px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.hero{grid-column:1/3;display:grid;grid-template-columns:7fr 5fr;gap:18px;align-items:stretch}
.hero > .card{height:100%} /* sorgt dafür, dass Video & Status exakt gleich hoch sind */

.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.05);display:flex;flex-direction:column}
.title{font-weight:700;}
.kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.kpi-label{color:var(--muted);font-size:12px}
.kpi-value{font-weight:900;font-size:22px}
.meter{width:100%;height:10px;background:#eef2f7;border:1px solid var(--border);border-radius:999px;overflow:hidden;margin-top:6px}
.meter>span{display:block;height:100%;background:linear-gradient(90deg,#06b6d4,#22c55e)}
.chart{height:200px} .chart-lg{height:280px}
.chart canvas{width:100%!important;height:100%!important}

.statbar{height:12px;border:1px solid var(--border);background:#eef2f7;border-radius:999px;overflow:hidden}
.statbar>span{display:block;height:100%}
.badge-soft{font-size:12px;padding:.15rem .5rem;border-radius:999px;border:1px solid var(--border);background:#f8fafc}

/* Info-Button & Popover (Gestik) */
.info-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:8px;
  border:1px solid var(--border); background:#f8fafc;
  transition:background .15s ease;
}
.info-btn:hover{ background:#eef2f7 }
.popover{
  position:relative; margin-top:.6rem;
  background:#fff; border:1px solid var(--border);
  border-radius:12px; padding:.7rem .9rem;
  box-shadow:0 10px 28px rgba(2,6,23,.08);
}
.popover-arrow{
  position:absolute; top:-7px; right:14px;
  width:12px; height:12px; transform:rotate(45deg);
  background:#fff; border-left:1px solid var(--border); border-top:1px solid var(--border);
}
.point {
  display:flex; align-items:center; gap:.5rem;
  font-size:14px; padding:.3rem .4rem; border-radius:8px;
}
.point.plus { color:#16a34a; background:#ecfdf5; }
.point.minus { color:#dc2626; background:#fef2f2; }
.point-symbol { font-weight:900; width:14px; text-align:center; }
.hidden{ display:none; }

.app-footer{
  grid-column:1/3;height:40px;display:flex;align-items:center;justify-content:center;
  border-top:1px solid var(--border);color:#6b7280;background:#fff8;backdrop-filter:blur(6px);margin-top:8px;
}

@media (max-width:1000px){
  .hero{grid-template-columns:1fr}
  main{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="flex items-center gap-2">
    <i data-lucide="sparkles" class="w-5 h-5 text-violet-700"></i>
    <span class="app-title">PresentAI</span>
    <span class="chip">Prototype</span>
  </div>
  <button id="rerun" class="btn btn-primary"><i data-lucide="wand-2" class="w-4 h-4"></i> Neu bewerten</button>
</header>

<main>
  <!-- Zeile 1: Video + Status (gleich hoch) -->
  <section class="hero">
    <div class="card p-4">
      <h3 class="title mb-3">Video-Vorschau</h3>
      <div class="bg-black aspect-video rounded-lg flex items-center justify-center text-gray-400 text-sm">Demo Video</div>
    </div>

    <div class="card p-4">
      <h3 class="title mb-3 flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-5 h-5"></i> Status</h3>
      <div class="grid grid-cols-3 gap-3">
        <div class="kpi">
          <p class="kpi-label">Gesamt</p>
          <p id="kpiScore" class="kpi-value">–</p>
          <div class="meter"><span id="scoreBar"></span></div>
        </div>
        <div class="kpi">
          <p class="kpi-label">Ø WPM</p>
          <p id="kpiWpm" class="kpi-value">–</p>
        </div>
        <div class="kpi">
          <p class="kpi-label">Füllwörter</p>
          <p id="kpiFill" class="kpi-value">–</p>
        </div>
      </div>
      <!-- Platzfüller sorgt dafür, dass die Karte die volle Höhe der Zeile einnimmt -->
      <div class="mt-auto"></div>
    </div>
  </section>

  <!-- Zeile 2: WPM + Füllwörter -->
  <section class="card p-4">
    <h3 class="title mb-2">Geschwindigkeit (WPM)</h3>
    <div class="chart chart-lg"><canvas id="wpmChart"></canvas></div>
  </section>

  <section class="card p-4">
    <h3 class="title mb-2">Füllwörter</h3>
    <div class="grid md:grid-cols-2 gap-3">
      <div class="chart"><canvas id="fillerBars"></canvas></div>
      <div class="chart"><canvas id="fillerScatter"></canvas></div>
    </div>
  </section>

  <!-- Zeile 3: Publikumsfokus + Gestik -->
  <section class="card p-4">
    <h3 class="title mb-2">Publikumsfokus</h3>
    <div>
      <div class="flex items-center justify-between text-sm mb-1">
        <span class="font-medium">Blick → Publikum</span><span id="gazePubPct" class="badge-soft">–%</span>
      </div>
      <div class="statbar"><span id="gazeBar" style="width:0%;background:#0ea5e9"></span></div>
      <p class="text-xs text-gray-500 mt-1">Rest: Boden/Decke</p>
    </div>
  </section>

  <section class="card p-4" id="gestureCard">
    <div class="flex items-center justify-between mb-1">
      <h3 class="title">Gestik – KI-Fazit</h3>
      <button id="gestureInfoBtn" class="info-btn" aria-label="Warum?" aria-expanded="false" aria-controls="gestureInfo">
        <i data-lucide="info" class="w-4 h-4"></i>
      </button>
    </div>
    <p id="gestureVerdict" class="text-xl font-extrabold">–</p>
    <p id="gestureSubtitle" class="text-sm text-gray-600">Automatische Einschätzung deiner Körpersprache.</p>
    <div id="gestureInfo" class="popover hidden">
      <div class="popover-arrow"></div>
      <p class="font-medium mb-1">Warum dieses Fazit?</p>
      <ul id="gestureWhy" class="list-none space-y-1"></ul>
    </div>
  </section>

  <footer class="app-footer">© <span id="year"></span> PresentAI • Demo</footer>
</main>

<script>
lucide.createIcons();
document.getElementById('year').textContent = new Date().getFullYear();

const rnd=(min,max)=>Math.round(min+Math.random()*(max-min));
const pick=a=>a[Math.floor(Math.random()*a.length)];

// Dummy Daten
function makeData(){
  const segs=Array.from({length:7},()=>rnd(100,180));
  const fillers=Array.from({length:rnd(8,15)},()=>({t:rnd(0,180),word:pick(['äh','ähm','sozusagen','halt','irgendwie'])}));
  const gaze=rnd(40,90);
  const gest={expressiveness:rnd(40,95),naturalness:rnd(40,95),tensionLow:rnd(30,95),sync:rnd(35,95)};
  const overall=Math.max(0,Math.min(100, Math.round(
    0.40*(segs.filter(x=>x>=120&&x<=160).length/segs.length)*100 +
    0.30*(100 - fillers.length*3) +
    0.30*gaze
  )));
  return {segs,fillers,gaze,gest,overall};
}

// Gestik Bewertung
function gestureVerdictFrom(g){
  const score=Math.round(0.3*g.expressiveness+0.3*g.naturalness+0.25*g.sync+0.15*g.tensionLow);
  let verdict,subtitle;
  if(score>=82){verdict='Gestik sehr überzeugend';subtitle='Natürlich, passend und wirkungsvoll.';}
  else if(score>=68){verdict='Gute Gestik';subtitle='Meist flüssig, punktuell noch präziser einsetzbar.';}
  else if(score>=52){verdict='Ausbaufähige Gestik';subtitle='Mehr Ruhe, klarere Akzente helfen.';}
  else{verdict='Zurückhaltende Gestik';subtitle='Mehr Ausdruck und Offenheit empfehlenswert.';}

  const bullets=[];
  bullets.push({text:g.expressiveness>=70?'sichtbare, abwechslungsreiche Handbewegungen':'Gesten oft zu klein oder selten sichtbar',positive:g.expressiveness>=70});
  bullets.push({text:g.naturalness>=70?'Bewegungen wirken frei und ungezwungen':'teilweise steif oder unnatürlich',positive:g.naturalness>=70});
  bullets.push({text:g.sync>=70?'Gesten kommen an Satzhöhepunkten':'Timing passt nicht immer zum Gesagten',positive:g.sync>=70});
  bullets.push({text:g.tensionLow>=70?'ruhige Schultern, wenig Nervosität':'spürbare Körperspannung oder Unruhe',positive:g.tensionLow>=70});

  return {score,verdict,subtitle,bullets};
}

function renderGestureFazit(gest){
  const res=gestureVerdictFrom(gest);
  const vEl=document.getElementById('gestureVerdict');
  const sEl=document.getElementById('gestureSubtitle');
  const whyList=document.getElementById('gestureWhy');
  const info=document.getElementById('gestureInfo');
  const btn=document.getElementById('gestureInfoBtn');

  vEl.textContent=`${res.verdict} (${res.score}/100)`;
  sEl.textContent=res.subtitle;
  whyList.innerHTML=res.bullets.map(b=>
    `<li class="point ${b.positive?'plus':'minus'}">
       <span class="point-symbol">${b.positive?'+':'–'}</span>${b.text}
     </li>`).join("");

  // Toggle Popover
  function closePop(){ info.classList.add('hidden'); btn.setAttribute('aria-expanded','false'); }
  function openPop(){ info.classList.remove('hidden'); btn.setAttribute('aria-expanded','true'); }
  btn.onclick=()=> btn.getAttribute('aria-expanded')==='true' ? closePop() : openPop();
  document.addEventListener('click',e=>{ if(!e.target.closest('#gestureCard')) closePop(); });

  lucide.createIcons();
}

// Charts
let wpmChart,fillerBars,fillerScatter;
function render(data){
  // KPIs
  document.getElementById('kpiWpm').textContent=Math.round(data.segs.reduce((a,b)=>a+b)/data.segs.length)+' wpm';
  document.getElementById('kpiFill').textContent=data.fillers.length;
  document.getElementById('kpiScore').textContent=data.overall;
  document.getElementById('scoreBar').style.width=data.overall+'%';

  // Fokus
  document.getElementById('gazePubPct').textContent=data.gaze+'%';
  document.getElementById('gazeBar').style.width=data.gaze+'%';

  // WPM
  if(wpmChart)wpmChart.destroy();
  wpmChart=new Chart(document.getElementById('wpmChart'),{
    type:'bar',
    data:{labels:data.segs.map((_,i)=>'S'+(i+1)),datasets:[{data:data.segs,label:'WPM'}]},
    options:{responsive:true,scales:{y:{beginAtZero:true}}}
  });

  // Füllwörter pro Minute
  const mins=4; const counts=new Array(mins).fill(0);
  data.fillers.forEach(f=>{const m=Math.min(mins-1,Math.floor(f.t/60)); counts[m]++;});
  if(fillerBars)fillerBars.destroy();
  fillerBars=new Chart(document.getElementById('fillerBars'),{
    type:'bar',data:{labels:counts.map((_,i)=>i+1),datasets:[{data:counts,label:'Füllwörter/Min'}]},
    options:{responsive:true,scales:{y:{beginAtZero:true}}}
  });

  // Zeitpunkte (größere Punkte)
  if(fillerScatter)fillerScatter.destroy();
  fillerScatter=new Chart(document.getElementById('fillerScatter'),{
    type:'scatter',
    data:{datasets:[{label:'Zeitpunkte',data:data.fillers.map(f=>({x:f.t/60,y:1})),pointRadius:5}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'Minuten'}},y:{display:false,min:0,max:2}}}
  });

  renderGestureFazit(data.gest);
}

// Init
let STATE=makeData(); render(STATE);
document.getElementById('rerun').onclick=()=>{STATE=makeData();render(STATE);};
</script>
</body>
</html>
